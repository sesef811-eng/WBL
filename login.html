<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تسجيل الدخول | عالم بين سطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #0f766e, #0f5c54);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .auth-container {
            background: white;
            border-radius: 2rem;
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            text-align: center;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .logo i {
            font-size: 2.5rem;
            color: #0f766e;
        }
        .logo strong {
            font-size: 1.8rem;
            color: #0f766e;
        }
        .tabs {
            display: flex;
            gap: 1rem;
            margin: 1.5rem 0;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab {
            flex: 1;
            padding: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            color: #64748b;
            transition: 0.2s;
        }
        .tab.active {
            color: #0f766e;
            border-bottom: 2px solid #0f766e;
        }
        .input-group {
            margin: 1rem 0;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 500;
            color: #1e293b;
        }
        .input-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #cbd5e1;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.2s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #0f766e;
            box-shadow: 0 0 0 3px rgba(15,118,110,0.2);
        }
        .btn {
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            border: none;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .btn-primary {
            background: #0f766e;
            color: white;
        }
        .btn-primary:hover {
            background: #0f5c54;
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #0f766e;
            color: #0f766e;
        }
        .btn-outline:hover {
            background: #0f766e;
            color: white;
        }
        .error-msg {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .success-msg {
            color: #10b981;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            text-align: center;
        }
        .back-home {
            display: inline-block;
            margin-top: 1rem;
            color: #0f766e;
            text-decoration: none;
            font-weight: 500;
        }
        .back-home:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="auth-container">
    <div class="logo">
        <i class="fas fa-book-open"></i>
        <strong>عالم بين سطور</strong>
    </div>
    <div class="tabs">
        <div class="tab active" data-tab="login">تسجيل الدخول</div>
        <div class="tab" data-tab="register">إنشاء حساب</div>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="loginEmail" placeholder="example@domain.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="loginPassword" placeholder="********">
        </div>
        <button class="btn btn-primary" id="doLogin">دخول</button>
        <div id="loginError" class="error-msg"></div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display:none;">
        <div class="input-group">
            <label>اسم المستخدم (ظاهر للجميع)</label>
            <input type="text" id="regUsername" placeholder="اسم فريد">
        </div>
        <div class="input-group">
            <label>البريد الإلكتروني</label>
            <input type="email" id="regEmail" placeholder="example@domain.com">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="regPassword" placeholder="6 أحرف على الأقل">
        </div>
        <button class="btn btn-primary" id="doRegister">إنشاء حساب</button>
        <div id="registerError" class="error-msg"></div>
        <div id="registerSuccess" class="success-msg"></div>
    </div>

    <a href="index.html" class="back-home"><i class="fas fa-arrow-right"></i> العودة إلى الرئيسية</a>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    // Firebase Config (نفس البيانات)
    const firebaseConfig = {
        apiKey: "AIzaSyBGPtZG34gQYuRHS-L6XQVD2hJzQk82Wtk",
        authDomain: "wbl-22ec7.firebaseapp.com",
        databaseURL: "https://wbl-22ec7-default-rtdb.firebaseio.com",
        projectId: "wbl-22ec7",
        storageBucket: "wbl-22ec7.firebasestorage.app",
        messagingSenderId: "274287684930",
        appId: "1:274287684930:web:f22ec7d9c56341dcc56cdb",
        measurementId: "G-WWMCVQ6Z09"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Tab switching
    const tabs = document.querySelectorAll('.tab');
    const loginFormDiv = document.getElementById('loginForm');
    const registerFormDiv = document.getElementById('registerForm');
    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            if (tab.dataset.tab === 'login') {
                loginFormDiv.style.display = 'block';
                registerFormDiv.style.display = 'none';
            } else {
                loginFormDiv.style.display = 'none';
                registerFormDiv.style.display = 'block';
            }
            document.getElementById('loginError').innerText = '';
            document.getElementById('registerError').innerText = '';
            document.getElementById('registerSuccess').innerText = '';
        });
    });

    // Login
    document.getElementById('doLogin').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const errorDiv = document.getElementById('loginError');
        if (!email || !password) {
            errorDiv.innerText = 'يرجى إدخال البريد الإلكتروني وكلمة المرور';
            return;
        }
        try {
            await auth.signInWithEmailAndPassword(email, password);
            window.location.href = 'index.html';
        } catch (err) {
            errorDiv.innerText = 'فشل تسجيل الدخول: ' + err.message;
        }
    });

    // Register
    document.getElementById('doRegister').addEventListener('click', async () => {
        const username = document.getElementById('regUsername').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const errorDiv = document.getElementById('registerError');
        const successDiv = document.getElementById('registerSuccess');
        if (!username || !email || !password) {
            errorDiv.innerText = 'جميع الحقول مطلوبة';
            return;
        }
        if (password.length < 6) {
            errorDiv.innerText = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            return;
        }
        try {
            // Check username uniqueness
            const usernameCheck = await db.collection('usernames').doc(username).get();
            if (usernameCheck.exists) {
                errorDiv.innerText = 'اسم المستخدم مستخدم بالفعل';
                return;
            }
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            await cred.user.updateProfile({ displayName: username });
            await db.collection('usernames').doc(username).set({ uid: cred.user.uid });
            await db.collection('users').doc(cred.user.uid).set({
                username: username,
                email: email,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            successDiv.innerText = 'تم إنشاء الحساب بنجاح! جارٍ التحويل...';
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        } catch (err) {
            errorDiv.innerText = 'خطأ: ' + err.message;
        }
    });
</script>
</body>
</html>
