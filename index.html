<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WBL | منصة قراءة تفاعلية</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #f8f9fc; --bg-secondary: #ffffff; --bg-card: #ffffff;
            --bg-hover: #f1f5f9; --text-primary: #1e293b; --text-secondary: #475569;
            --text-muted: #94a3b8; --border: #e2e8f0; --primary: #6c5ce7;
            --primary-dark: #5b4bc4; --accent: #00cec9; --danger: #ff7675;
            --rating: #fdcb6e; --success: #00b894;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-hover: 0 10px 15px -3px rgba(0,0,0,0.1);
        }
        body.dark {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #334155;
            --bg-hover: #475569; --text-primary: #f1f5f9; --text-secondary: #cbd5e1;
            --text-muted: #94a3b8; --border: #334155; --primary: #a78bfa;
            --primary-dark: #8b5cf6;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: 0.3s; line-height: 1.5; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow);
        }
        .header-flex {
            max-width: 1400px; margin: 0 auto; padding: 12px 32px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
        }
        .logo {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            cursor: pointer;
        }
        .nav-links { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; font-weight: 600; color: var(--text-secondary); transition: 0.2s; cursor: pointer; font-size: 15px; }
        .nav-links a:hover { color: var(--primary); }
        .auth-buttons { display: flex; gap: 12px; align-items: center; }
        .signin-btn { background: var(--primary); color: white; border: none; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: 600; }
        .signin-btn:hover { background: var(--primary-dark); transform: scale(1.02); }
        .profile-btn { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); padding: 6px 18px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .theme-toggle { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 40px; padding: 8px 16px; cursor: pointer; color: var(--text-primary); }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }

        .books-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin: 30px 0; }
        @media (min-width: 768px) { .books-grid { grid-template-columns: repeat(4, 1fr); gap: 22px; } }
        @media (min-width: 1024px) { .books-grid { grid-template-columns: repeat(6, 1fr); gap: 24px; } }
        
        .book-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; transition: 0.25s ease; cursor: pointer; border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; }
        .book-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--primary); }
        .book-card:hover .card-cover { background-size: 110%; }
        .card-cover { aspect-ratio: 2 / 3; background-size: cover; background-position: center; position: relative; background-color: #e2e8f0; transition: background-size 0.3s ease; }
        .badge-status { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); color: white; font-size: 10px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
        .favorite-icon { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; transition: 0.2s; }
        .favorite-icon:hover { transform: scale(1.1); }
        .favorite-icon.active { color: var(--danger); background: rgba(0,0,0,0.8); }
        .card-info { padding: 10px 8px 8px; text-align: center; }
        .card-title { font-weight: 700; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-author { font-size: 10px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .rating-stars { color: var(--rating); font-size: 11px; margin: 4px 0; display: flex; justify-content: center; gap: 3px; direction: ltr; }
        .stats { display: flex; justify-content: center; gap: 12px; font-size: 9px; color: var(--text-muted); margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }
        
        .search-bar, .filter-bar, .detail-container, .comments-section, .profile-header, .publish-form, .reader-container { background: var(--bg-secondary); border-radius: 24px; padding: 20px; margin: 20px 0; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .search-bar { display: flex; gap: 12px; align-items: center; }
        .search-bar input { flex: 1; background: transparent; border: none; outline: none; color: var(--text-primary); font-family: inherit; }
        .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
        .filter-group, .sort-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .filter-btn, .sort-btn { background: var(--bg-primary); border: 1px solid var(--border); padding: 6px 16px; border-radius: 40px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); transition: 0.2s; }
        .filter-btn.active, .sort-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin: 32px 0 16px; }
        .section-title { font-size: 22px; font-weight: 800; border-right: 4px solid var(--primary); padding-right: 12px; }
        .detail-header { display: flex; flex-wrap: wrap; gap: 24px; }
        .detail-cover { width: 160px; height: 240px; background-size: cover; background-position: center; border-radius: 16px; }
        .detail-meta { flex: 1; }
        .genres { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .genre-tag { background: var(--bg-primary); padding: 4px 12px; border-radius: 30px; font-size: 12px; }
        .btn { background: var(--primary); border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; color: white; transition: 0.2s; font-family: inherit; }
        .btn:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }
        .comment-input-wrapper { display: flex; gap: 12px; margin: 20px 0; }
        .comment-avatar { width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; }
        .comment-input-area { flex: 1; background: var(--bg-primary); border-radius: 60px; padding: 0 16px; display: flex; align-items: center; border: 1px solid var(--border); }
        .comment-input-area input { width: 100%; background: transparent; border: none; padding: 10px 0; outline: none; color: var(--text-primary); font-family: inherit; }
        .comment-item { padding: 12px; background: var(--bg-hover); border-radius: 16px; margin-bottom: 12px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 24px; padding: 24px; width: 90%; max-width: 450px; border: 1px solid var(--border); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, textarea, select { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-primary); color: var(--text-primary); font-family: inherit; outline: none; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); }
        .genres-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .genre-option { background: var(--bg-primary); border: 1px solid var(--border); padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; color: var(--text-secondary); transition: 0.2s; font-family: inherit; }
        .genre-option.active { background: var(--primary); color: white; border-color: var(--primary); }
        .progress-bar { position: fixed; top: 0; right: 0; width: 0%; height: 3px; background: var(--primary); z-index: 1001; transition: width 0.1s; }
        .quote-display { text-align: center; padding: 16px; font-style: italic; color: var(--primary); border-right: 3px solid var(--primary); margin: 16px auto; width: 80%; background: var(--bg-primary); border-radius: 0 12px 12px 0; }
        .star-rating { display: flex; gap: 8px; justify-content: flex-start; direction: ltr; margin: 10px 0; }
        .star { font-size: 28px; cursor: pointer; color: #ddd; transition: 0.1s; }
        .star.active { color: gold; }
        .hidden-page { display: none !important; }
        footer { text-align: center; padding: 24px; border-top: 1px solid var(--border); margin-top: 40px; color: var(--text-muted); font-size: 14px; }
        .toast { position: fixed; bottom: 20px; left: 20px; background: #2f3542; color: white; padding: 12px 24px; border-radius: 40px; z-index: 3000; font-size: 14px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @media (max-width: 768px) { .container { padding: 0 16px; } .detail-header { flex-direction: column; align-items: center; text-align: center; } .header-flex { padding: 12px 16px; } }
    </style>
</head>
<body>
<header>
    <div class="header-flex">
        <div class="logo" onclick="showPage('home')">WBL | <span>عالم بين سطور</span></div>
        <div class="nav-links">
            <a class="nav-link" data-page="home">الرئيسية</a>
            <a class="nav-link" data-page="explore">استكشاف</a>
            <a class="nav-link" data-page="mylibrary">مكتبتي</a>
            <a class="nav-link" data-page="publish">نشر عمل</a>
            <div class="auth-buttons" id="authButtons">
                <button class="signin-btn" onclick="openSignInModal()">Sign In</button>
            </div>
            <button class="theme-toggle" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</header>
<main class="container" id="app">
    <div id="homePage"><div class="filter-bar" id="homeFilterBar"></div><div id="homeSections"></div></div>
    <div id="explorePage" class="hidden-page"><div class="search-bar"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="ابحث عن كتاب..." oninput="filterExplore()"></div><div class="filter-bar" id="exploreFilterBar"></div><div id="exploreGrid" class="books-grid"></div></div>
    <div id="mylibraryPage" class="hidden-page"><h2>📚 مكتبتي</h2><div class="section-header"><h3>⭐ المفضلة</h3></div><div id="favoritesGrid" class="books-grid"></div><div class="section-header"><h3>📖 قيد القراءة</h3></div><div id="readingNowGrid" class="books-grid"></div></div>
    <div id="profilePage" class="hidden-page"></div>
    <div id="publishPage" class="hidden-page"></div>
    <div id="detailPage" class="hidden-page"></div>
    <div id="readingPage" class="hidden-page"></div>
</main>
<footer>© 2026 WBL - منصة قراءة تفاعلية</footer>

<script>
    // -------------------- إعداد Firebase --------------------
    const firebaseConfig = {
        apiKey: "AIzaSyBGPtZG34gQYuRHS-L6XQVD2hJzQk82Wtk",
        authDomain: "wbl-22ec7.firebaseapp.com",
        projectId: "wbl-22ec7",
        storageBucket: "wbl-22ec7.firebasestorage.app",
        messagingSenderId: "274287684930",
        appId: "1:274287684930:web:f22ec7d9c56341dcc56cdb",
        measurementId: "G-WWMCVQ6Z09"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // -------------------- متغيرات عالمية --------------------
    let currentUser = null;
    let books = [];
    let userFavorites = [];
    let userReadingProgress = {};
    let currentFilter = "الكل";
    let currentSort = "popular";
    let searchTerm = "";
    let availableGenres = ["أكشن", "فانتازيا", "غموض", "دراما", "رومانسية", "رعب", "خيال علمي", "مغامرات", "كوميديا", "تاريخي"];
    let selectedGenres = [];

    // -------------------- دوال مساعدة --------------------
    function showToast(msg) {
        let t = document.createElement("div");
        t.className = "toast";
        t.innerText = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2500);
    }

    function updateAuthUI() {
        const authDiv = document.getElementById("authButtons");
        if(currentUser) {
            authDiv.innerHTML = `<button class="profile-btn" onclick="showProfile()"><i class="fas fa-user-circle"></i> ${(currentUser.displayName || currentUser.email).substring(0,10)}</button><button class="profile-btn" onclick="signOut()"><i class="fas fa-sign-out-alt"></i></button>`;
        } else {
            authDiv.innerHTML = `<button class="signin-btn" onclick="openSignInModal()">Sign In</button>`;
        }
    }

    function openSignInModal() {
        closeModal();
        let modalHtml = `
            <div id="signModal" class="modal active" onclick="if(event.target===this) closeModal()">
                <div class="modal-content">
                    <h3 style="margin-bottom:16px;">مرحباً بك في WBL</h3>
                    <div class="form-group"><input type="email" id="loginEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="form-group"><input type="password" id="loginPassword" placeholder="كلمة السر"></div>
                    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:20px;">
                        <button class="btn" onclick="login()">تسجيل الدخول</button>
                        <button class="btn-outline btn" onclick="showRegister()">إنشاء حساب</button>
                        <button class="btn-outline btn" onclick="signInWithGoogle()"><i class="fab fa-google"></i> Google</button>
                        <button class="btn-outline btn" onclick="closeModal()">إلغاء</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    function showRegister() {
        closeModal();
        let modalHtml = `
            <div id="signModal" class="modal active" onclick="if(event.target===this) closeModal()">
                <div class="modal-content">
                    <h3 style="margin-bottom:16px;">إنشاء حساب جديد</h3>
                    <div class="form-group"><input type="text" id="regName" placeholder="الاسم الكامل"></div>
                    <div class="form-group"><input type="email" id="regEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="form-group"><input type="password" id="regPassword" placeholder="كلمة السر"></div>
                    <div class="form-group"><textarea id="regBio" rows="2" placeholder="نبذة عنك"></textarea></div>
                    <div style="display:flex; gap:12px; margin-top:20px;">
                        <button class="btn" onclick="register()">تسجيل الحساب</button>
                        <button class="btn-outline btn" onclick="openSignInModal()">لدي حساب بالفعل</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    async function login() {
        let email = document.getElementById("loginEmail").value.trim();
        let password = document.getElementById("loginPassword").value.trim();
        if(!email || !password) { showToast("الرجاء ملء كافة الحقول"); return; }
        try {
            let cred = await auth.signInWithEmailAndPassword(email, password);
            currentUser = cred.user;
            updateAuthUI();
            closeModal();
            showToast(`مرحباً بك مجدداً`);
            await loadUserData();
            await loadBooks();
            showPage("home");
        } catch(e) { showToast("فشل تسجيل الدخول: بيانات غير صحيحة"); }
    }

    async function register() {
        let name = document.getElementById("regName").value.trim();
        let email = document.getElementById("regEmail").value.trim();
        let password = document.getElementById("regPassword").value.trim();
        let bio = document.getElementById("regBio").value.trim();
        if(!name || !email || !password) { showToast("جميع الحقول الأساسية مطلوبة"); return; }
        try {
            let cred = await auth.createUserWithEmailAndPassword(email, password);
            await cred.user.updateProfile({ displayName: name });
            currentUser = cred.user;
            await db.collection("users").doc(currentUser.uid).set({
                username: name, email: email, bio: bio || "قارئ جديد",
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            updateAuthUI();
            closeModal();
            showToast(`تم إنشاء الحساب بنجاح!`);
            await loadUserData();
            await loadBooks();
            showPage("home");
        } catch(e) { showToast("خطأ أثناء التسجيل: " + e.message); }
    }

    async function signInWithGoogle() {
        try {
            let result = await auth.signInWithPopup(provider);
            currentUser = result.user;
            let userDoc = await db.collection("users").doc(currentUser.uid).get();
            if(!userDoc.exists) {
                await db.collection("users").doc(currentUser.uid).set({
                    username: currentUser.displayName || "مستخدم جوجل",
                    email: currentUser.email,
                    bio: "قارئ جديد",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            }
            updateAuthUI();
            closeModal();
            showToast(`مرحباً بك عبر Google`);
            await loadUserData();
            await loadBooks();
            showPage("home");
        } catch(e) { showToast("فشل تسجيل الدخول بواسطة جوجل"); }
    }

    function closeModal() { let modal = document.querySelector(".modal"); if(modal) modal.remove(); }
    async function signOut() { await auth.signOut(); currentUser = null; userFavorites = []; userReadingProgress = {}; updateAuthUI(); showToast("تم تسجيل الخروج"); showPage("home"); }

    async function loadUserData() {
        if(!currentUser) return;
        try {
            let favDoc = await db.collection("favorites").doc(currentUser.uid).get();
            userFavorites = favDoc.exists ? favDoc.data().bookIds || [] : [];
            let progressDoc = await db.collection("readingProgress").doc(currentUser.uid).get();
            userReadingProgress = progressDoc.exists ? progressDoc.data().progress || {} : {};
        } catch (e) { console.log("خطأ تحميل بيانات المستخدم:", e); }
    }

    async function loadBooks() {
        try {
            const snapshot = await db.collection("books").get();
            books = [];
            snapshot.forEach(doc => books.push({ id: doc.id, ...doc.data() }));
        } catch (e) { console.log("خطأ جلب Firestore، سيتم تشغيل البيانات الافتراضية:", e); }
        
        if(books.length === 0) {
            books = [
                { id: "b1", title: "أسطورة التنين", author: "لين تشن", authorId: "u1", description: "قصة صياد يصبح أقوى تنين", genres: ["أكشن", "فانتازيا"], status: "مستمر", cover: "https://picsum.photos/id/104/200/300", views: 1240, rating: 4.2, ratingCount: 230, ratingSum: 966, chapters:[{title:"الفصل الأول", description:"بداية الصياد", content:"في زمان بعيد، عاش صياد شاب في قرية نائية... \n وبدأ يكتشف قوى غريبة تحيط به عند وادي التنانين السبعة القديم."}], createdAt: firebase.firestore.Timestamp.now() },
                { id: "b2", title: "سجلات الظل", author: "ريم الغامدي", authorId: "u2", description: "غموض وخيانة وعوالم مظلمة", genres: ["غموض", "دراما"], status: "مكتمل", cover: "https://picsum.photos/id/106/200/300", views: 890, rating: 3.9, ratingCount: 112, ratingSum: 437, chapters:[], createdAt: firebase.firestore.Timestamp.now() },
                { id: "b3", title: "رحلة الأمل", author: "سارة الأحمد", authorId: "u3", description: "قصة ملهمة تلمس القلوب", genres: ["دراما", "رومانسية"], status: "مستمر", cover: "https://picsum.photos/id/20/200/300", views: 3200, rating: 4.6, ratingCount: 450, ratingSum: 2070, chapters:[], createdAt: firebase.firestore.Timestamp.now() }
            ];
        }
        renderAll();
    }

    async function toggleFav(bookId) {
        if(!currentUser) { openSignInModal(); return; }
        let favRef = db.collection("favorites").doc(currentUser.uid);
        if(userFavorites.includes(bookId)) {
            userFavorites = userFavorites.filter(id => id !== bookId);
            showToast("تمت الإزالة من المفضلة");
        } else {
            userFavorites.push(bookId);
            showToast("أضيفت إلى المفضلة");
        }
        await favRef.set({ bookIds: userFavorites });
        renderAll();
        if(document.getElementById("detailPage").classList.contains("hidden-page") === false) { showDetail(bookId); }
    }

    async function rateBook(bookId, rating) {
        if(!currentUser) { openSignInModal(); return; }
        let bookRef = db.collection("books").doc(bookId);
        let ratingDocRef = db.collection("ratings").doc(`${currentUser.uid}_${bookId}`);
        let existing = await ratingDocRef.get();
        let delta = 0;
        if(existing.exists) {
            let oldRating = existing.data().rating;
            delta = rating - oldRating;
            await ratingDocRef.update({ rating: rating, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } else {
            delta = rating;
            await ratingDocRef.set({ userId: currentUser.uid, bookId: bookId, rating: rating, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
        }
        let bookDoc = await bookRef.get();
        if(bookDoc.exists) {
            let ratingCount = bookDoc.data().ratingCount || 0;
            let ratingSum = bookDoc.data().ratingSum || 0;
            let newRatingSum = ratingSum + delta;
            let newRatingCount = ratingCount + (existing.exists ? 0 : 1);
            let newAvg = newRatingCount > 0 ? newRatingSum / newRatingCount : 0;
            await bookRef.update({ rating: newAvg, ratingCount: newRatingCount, ratingSum: newRatingSum });
        }
        showToast("تم حفظ تقييمك بنجاح ⭐");
        await loadBooks();
        showDetail(bookId);
    }

    function renderBookCard(book, isFav) {
        let favClass = (isFav !== undefined ? isFav : userFavorites.includes(book.id)) ? "active" : "";
        let fullStars = Math.floor(book.rating || 0);
        let halfStar = ((book.rating || 0) % 1) >= 0.5;
        let starsHtml = "";
        for(let i=1; i<=5; i++) {
            if(i <= fullStars) starsHtml += "<i class='fas fa-star'></i>";
            else if(i == fullStars+1 && halfStar) starsHtml += "<i class='fas fa-star-half-alt'></i>";
            else starsHtml += "<i class='far fa-star'></i>";
        }
        return `
            <div class="book-card" onclick="showDetail('${book.id}')">
                <div class="card-cover" style="background-image:url('${book.cover || 'https://picsum.photos/id/20/200/300'}')">
                    <div class="badge-status">${book.status || 'مستمر'}</div>
                    <div class="favorite-icon ${favClass}" onclick="event.stopPropagation(); toggleFav('${book.id}')"><i class="fas fa-heart"></i></div>
                </div>
                <div class="card-info">
                    <div class="card-title">${(book.title||'').substring(0,25)}</div>
                    <div class="card-author">${(book.author||'').substring(0,18)}</div>
                    <div class="rating-stars">${starsHtml} (${(book.rating || 0).toFixed(1)})</div>
                    <div class="stats"><span><i class="far fa-eye"></i> ${book.views||0}</span><span><i class="far fa-comment"></i> ${book.commentCount||0}</span></div>
                </div>
            </div>
        `;
    }

    function renderHome() {
        let all = books.filter(b => !b.hidden);
        let filtered = currentFilter === "الكل" ? all : all.filter(b => (b.genres || []).includes(currentFilter));
        
        let latest = [...filtered].sort((a,b) => {
            let tA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt instanceof Date ? a.createdAt.getTime() : 0);
            let tB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt instanceof Date ? b.createdAt.getTime() : 0);
            return tB - tA;
        }).slice(0,6);
        
        let top = [...filtered].sort((a,b) => (b.rating||0) - (a.rating||0)).slice(0,6);
        let popular = [...filtered].sort((a,b) => (b.views||0) - (a.views||0)).slice(0,6);
        
        let html = `
            <div class="section-header"><h2 class="section-title">🆕 الأحدث</h2><a onclick="goExplore('newest')" style="cursor:pointer;color:var(--primary)">عرض الكل</a></div>
            <div class="books-grid">${latest.length ? latest.map(b=>renderBookCard(b)).join('') : '<p style="grid-column:span 6; text-align:center; color:var(--text-muted)">لا توجد كتب متوفرة في هذا التصنيف</p>'}</div>
            <div class="section-header"><h2 class="section-title">⭐ الأعلى تقييماً</h2><a onclick="goExplore('top')" style="cursor:pointer;color:var(--primary)">عرض الكل</a></div>
            <div class="books-grid">${top.length ? top.map(b=>renderBookCard(b)).join('') : '<p style="grid-column:span 6; text-align:center; color:var(--text-muted)">لا توجد كتب متوفرة</p>'}</div>
            <div class="section-header"><h2 class="section-title">🔥 الأكثر قراءة</h2><a onclick="goExplore('popular')" style="cursor:pointer;color:var(--primary)">عرض الكل</a></div>
            <div class="books-grid">${popular.length ? popular.map(b=>renderBookCard(b)).join('') : '<p style="grid-column:span 6; text-align:center; color:var(--text-muted)">لا توجد كتب متوفرة</p>'}</div>
        `;
        document.getElementById("homeSections").innerHTML = html;
        let uniqueGenres = ["الكل", ...new Set(books.flatMap(b=>b.genres||[]))];
        document.getElementById("homeFilterBar").innerHTML = uniqueGenres.map(g => `<button class="filter-btn ${currentFilter===g?'active':''}" onclick="setFilter('${g}')">${g}</button>`).join('');
    }

    function setFilter(g) { currentFilter = g; renderHome(); }
    function goExplore(s) { currentSort = s; currentFilter = "الكل"; showPage("explore"); }

    function renderExplore() {
        let filtered = books.filter(b => currentFilter==="الكل" || (b.genres||[]).includes(currentFilter));
        if(searchTerm) filtered = filtered.filter(b => b.title.includes(searchTerm) || b.author.includes(searchTerm));
        let sorted = [...filtered];
        if(currentSort === "newest") {
            sorted.sort((a,b) => {
                let tA = a.createdAt?.toMillis ? a.createdAt.toMillis() : (a.createdAt instanceof Date ? a.createdAt.getTime() : 0);
                let tB = b.createdAt?.toMillis ? b.createdAt.toMillis() : (b.createdAt instanceof Date ? b.createdAt.getTime() : 0);
                return tB - tA;
            });
        }
        else if(currentSort === "top") sorted.sort((a,b) => (b.rating||0) - (a.rating||0));
        else if(currentSort === "popular") sorted.sort((a,b) => (b.views||0) - (a.views||0));
        
        document.getElementById("exploreGrid").innerHTML = sorted.length ? sorted.map(b=>renderBookCard(b)).join('') : '<p style="grid-column:span 6; text-align:center; color:var(--text-muted); padding:40px;">لم يتم العثور على نتائج للبحث</p>';
        let genres = ["الكل", ...new Set(books.flatMap(b=>b.genres||[]))];
        document.getElementById("exploreFilterBar").innerHTML = `
            <div class="filter-group">${genres.map(g => `<button class="filter-btn ${currentFilter===g?'active':''}" onclick="setFilterExplore('${g}')">${g}</button>`).join('')}</div>
            <div class="sort-group">
                <button class="sort-btn ${currentSort==='newest'?'active':''}" onclick="setSortExplore('newest')">الأحدث</button>
                <button class="sort-btn ${currentSort==='top'?'active':''}" onclick="setSortExplore('top')">الأعلى تقييماً</button>
                <button class="sort-btn ${currentSort==='popular'?'active':''}" onclick="setSortExplore('popular')">الأكثر قراءة</button>
            </div>
        `;
    }
    function setFilterExplore(g) { currentFilter = g; renderExplore(); }
    function setSortExplore(s) { currentSort = s; renderExplore(); }
    function filterExplore() { searchTerm = document.getElementById("searchInput").value; renderExplore(); }

    function renderLibrary() {
        let favs = books.filter(b => userFavorites.includes(b.id));
        let reading = books.filter(b => userReadingProgress[b.id]);
        document.getElementById("favoritesGrid").innerHTML = favs.length ? favs.map(b=>renderBookCard(b,true)).join('') : '<p style="color:var(--text-muted)">قائمتك المفضلة فارغة حالياً.</p>';
        document.getElementById("readingNowGrid").innerHTML = reading.length ? reading.map(b=>renderBookCard(b)).join('') : '<p style="color:var(--text-muted)">لا توجد كتب تقرأها حالياً، ابدأ تصفح الفصول.</p>';
    }

    function showProfile() {
        if(!currentUser) return;
        let profileHtml = `<div class="profile-header"><h2>${currentUser.displayName || currentUser.email}</h2><p style="color:var(--text-muted); margin:8px 0 24px;">${currentUser.email}</p><button class="btn" onclick="signOut()">تسجيل خروج الحساب</button></div>`;
        document.getElementById("profilePage").innerHTML = profileHtml;
        showPage("profile");
    }

    function showPublishPage() {
        if(!currentUser) { openSignInModal(); return; }
        selectedGenres = [];
        let html = `
            <div class="publish-form">
                <h2 style="margin-bottom:20px;">📝 نشر عمل أدبي / كتاب جديد</h2>
                <div class="form-group"><label>عنوان الكتاب</label><input type="text" id="pubTitle" placeholder="أدخل عنواناً جذاباً..."></div>
                <div class="form-group"><label>وصف مختصر للكتاب</label><textarea id="pubDesc" rows="4" placeholder="اكتب نبذة شيقة عن قصة الكتاب..."></textarea></div>
                <div class="form-group"><label>التصنيفات الأدبية (اختر ما يناسب العمل)</label><div id="genresPicker" class="genres-picker"></div></div>
                <div class="form-group"><label>رابط صورة الغلاف (اختياري)</label><input type="text" id="pubCover" placeholder="https://example.com/cover.jpg"></div>
                <div class="form-group"><label>حالة العمل الحالي</label><select id="pubStatus"><option>مستمر</option><option>مكتمل</option><option>متوقف</option></select></div>
                <button class="btn" style="margin-top:12px; width:100%; padding:12px;" onclick="publishBook()">نشر الكتاب في المنصة فوراً</button>
            </div>
        `;
        document.getElementById("publishPage").innerHTML = html;
        renderGenresPicker();
        showPage("publish");
    }

    function renderGenresPicker() {
        let container = document.getElementById("genresPicker");
        if(!container) return;
        container.innerHTML = availableGenres.map(g => `<button type="button" class="genre-option ${selectedGenres.includes(g)?'active':''}" onclick="toggleGenre('${g}')">${g}</button>`).join('');
    }
    window.toggleGenre = function(g) {
        let idx = selectedGenres.indexOf(g);
        idx === -1 ? selectedGenres.push(g) : selectedGenres.splice(idx,1);
        renderGenresPicker();
    };

    async function publishBook() {
        if(!currentUser) { showToast("يجب تسجيل الدخول أولاً"); return; }
        let title = document.getElementById("pubTitle").value.trim();
        let desc = document.getElementById("pubDesc").value.trim();
        let cover = document.getElementById("pubCover").value.trim();
        let status = document.getElementById("pubStatus").value;
        
        if(!title || !desc) { showToast("العنوان والوصف مطلوبان لنشر العمل"); return; }
        if(selectedGenres.length === 0) { showToast("اختر تصنيفاً واحداً على الأقل لعملك"); return; }
        
        // عينة للفصل الأول تلقائياً حتى يفتح القارئ بشكل طبيعي
        let defaultChapters = [{
            title: "الفصل الأول",
            description: "مقدمة تمهيدية للأحداث الأدبية",
            content: "هذا هو الفصل الافتتاحي للعمل المنشور حديثاً. انتظروا التحديثات القادمة من الكاتب قريباً!"
        }];

        let newBook = {
            title: title, 
            author: currentUser.displayName || currentUser.email, 
            authorId: currentUser.uid,
            description: desc, 
            genres: selectedGenres, 
            status: status,
            cover: cover || "https://picsum.photos/id/20/200/300",
            chapters: defaultChapters, 
            views: 0, 
            rating: 0, 
            ratingCount: 0, 
            ratingSum: 0,
            commentCount: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(), 
            hidden: false
        };
        
        try {
            await db.collection("books").add(newBook);
            showToast("🎉 تم نشر عملك الأدبي بنجاح على WBL!");
            selectedGenres = [];
            await loadBooks();
            showPage("home");
        } catch(e) {
            showToast("حدث خطأ أثناء الاتصال بقاعدة البيانات: " + e.message);
        }
    }

    async function showDetail(id) {
        let book = books.find(b => b.id === id);
        if(!book) return;
        try {
            await db.collection("books").doc(id).update({ views: firebase.firestore.FieldValue.increment(1) });
            book.views++;
        } catch(e) {}
        
        let userRating = 0;
        if(currentUser) {
            try {
                let ratingDoc = await db.collection("ratings").doc(`${currentUser.uid}_${id}`).get();
                if(ratingDoc.exists) userRating = ratingDoc.data().rating;
            } catch(e) {}
        }
        let starsHtml = "";
        for(let i=1;i<=5;i++) {
            starsHtml += `<i class="star ${i<=userRating ? 'fas fa-star' : 'far fa-star'}" data-rating="${i}" onclick="rateBook('${id}', ${i})"></i>`;
        }
        let ratingStars = "";
        let full = Math.floor(book.rating || 0);
        let half = ((book.rating || 0) % 1) >= 0.5;
        for(let i=1;i<=5;i++) {
            if(i <= full) ratingStars += "<i class='fas fa-star'></i>";
            else if(i == full+1 && half) ratingStars += "<i class='fas fa-star-half-alt'></i>";
            else ratingStars += "<i class='far fa-star'></i>";
        }
        let detailHtml = `
            <div class="detail-container">
                <div class="detail-header">
                    <div class="detail-cover" style="background-image:url('${book.cover}')"></div>
                    <div class="detail-meta">
                        <h1>${book.title}</h1>
                        <p style="margin:6px 0; font-weight:600; color:var(--primary)">✍️ الكاتب: ${book.author}</p>
                        <div class="genres">${(book.genres||[]).map(g=>`<span class="genre-tag">${g}</span>`).join('')}</div>
                        <p class="rating-stars" style="justify-content:flex-start; margin:12px 0;">${ratingStars} (${(book.rating || 0).toFixed(1)}) | 👁️ المشاهدات: ${book.views || 0}</p>
                        <p style="color:var(--text-secondary); margin-bottom:20px;">${book.description}</p>
                        <div style="display:flex; gap:12px;">
                            <button class="btn" onclick="openReader('${book.id}')">📖 ابدأ القراءة الآن</button>
                            <button class="btn-outline btn" onclick="toggleFav('${book.id}')">❤️ ${userFavorites.includes(id)?'مفضلة':'أضف للمفضلة'}</button>
                        </div>
                    </div>
                </div>
                <div style="margin-top:30px; border-top:1px solid var(--border); padding-top:20px;">
                    <h4>قيم هذا العمل الأدبي:</h4>
                    <div class="star-rating">${starsHtml}</div>
                </div>
                <div class="comments-section" style="margin-top:30px; box-shadow:none; padding:0; border:none; background:transparent;">
                    <h3>💬 مناقشات القراء (${book.commentCount || 0})</h3>
                    <div class="comment-input-wrapper">
                        <div class="comment-avatar"><i class="fas fa-user"></i></div>
                        <div class="comment-input-area"><input type="text" id="newComment" placeholder="اكتب رأيك أو مناقشتك للفصول هنا..."></div>
                        <button class="btn" onclick="addComment('${book.id}')">نشر التفاعل</button>
                    </div>
                    <div id="commentsList"></div>
                </div>
            </div>
        `;
        document.getElementById("detailPage").innerHTML = detailHtml;
        showPage("detail");
        loadComments(book.id);
    }

    async function loadComments(bookId) {
        try {
            let snap = await db.collection("comments").where("bookId","==",bookId).get();
            let html = "";
            let commentsArr = [];
            snap.forEach(doc => commentsArr.push({id: doc.id, ...doc.data()}));
            
            // ترتيب التعليقات برمجياً تحسباً لعدم إعداد فهرس قاعدة البيانات
            commentsArr.sort((a,b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
            
            commentsArr.forEach(c => {
                let dateStr = c.createdAt?.toDate ? c.createdAt.toDate().toLocaleString('ar-EG') : "";
                html += `
                    <div class="comment-item">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <strong>${c.userName}</strong>
                            <span style="font-size:11px; color:var(--text-muted)">${dateStr}</span>
                        </div>
                        <p style="font-size:14px; color:var(--text-secondary);">${c.text}</p>
                        ${currentUser && currentUser.uid === c.userId ? `<button class="btn-outline btn" style="padding:2px 8px; font-size:11px; margin-top:8px; border-radius:6px;" onclick="deleteComment('${bookId}','${c.id}')">حذف</button>` : ''}
                    </div>`;
            });
            document.getElementById("commentsList").innerHTML = html || '<p style="color:var(--text-muted); text-align:center; padding:12px;">لا توجد تعليقات بعد، كن أول من يكتب رأيه!</p>';
        } catch(e) { console.log(e); }
    }

    async function addComment(bookId) {
        if(!currentUser) { openSignInModal(); return; }
        let text = document.getElementById("newComment").value.trim();
        if(!text) return;
        try {
            await db.collection("comments").add({
                bookId: bookId, userId: currentUser.uid, userName: currentUser.displayName || currentUser.email,
                text: text, createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            document.getElementById("newComment").value = "";
            
            let bRef = db.collection("books").doc(bookId);
            await bRef.update({ commentCount: firebase.firestore.FieldValue.increment(1) });
            let bIndex = books.findIndex(b=>b.id===bookId);
            if(bIndex!==-1) books[bIndex].commentCount = (books[bIndex].commentCount || 0) + 1;
            
            loadComments(bookId);
        } catch(e) { showToast("فشل النشر"); }
    }

    async function deleteComment(bookId, commentId) {
        try {
            await db.collection("comments").doc(commentId).delete();
            await db.collection("books").doc(bookId).update({ commentCount: firebase.firestore.FieldValue.increment(-1) });
            let bIndex = books.findIndex(b=>b.id===bookId);
            if(bIndex!==-1) books[bIndex].commentCount = Math.max(0, (books[bIndex].commentCount || 1) - 1);
            loadComments(bookId);
        } catch(e){}
    }

    async function openReader(bookId) {
        let book = books.find(b => b.id === bookId);
        if(!book || !book.chapters || book.chapters.length === 0) { showToast("لا توجد فصول متوفرة للقراءة في هذا الكتاب بعد."); return; }
        
        // حفظ تقدم القراءة في مكتبة المستخدم محلياً وسحابياً
        if (currentUser) {
            userReadingProgress[bookId] = true;
            try {
                await db.collection("readingProgress").doc(currentUser.uid).set({ progress: userReadingProgress }, { merge: true });
            } catch(e){}
        }

        let chapter = book.chapters[0];
        let html = `
            <div class="progress-bar" id="readProgressBar"></div>
            <div class="reader-container">
                <div class="reader-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:12px;">
                    <h2>${book.title} - ${chapter.title}</h2>
                    <button class="btn btn-outline" onclick="showDetail('${book.id}')">العودة للتفاصيل</button>
                </div>
                <div class="quote-display">✨ "${chapter.description || 'استمتع بجلسة قراءة هادئة وعميقة.'}" ✨</div>
                <div class="reader-content" style="margin-top:24px; font-size:18px; line-height:1.8; text-align:justify;">
                    <div class="page-text">${chapter.content.replace(/\n/g,'<br>')}</div>
                </div>
            </div>`;
        document.getElementById("readingPage").innerHTML = html;
        showPage("reading");
        
        window.onReaderScroll = function() {
            let winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            let height = document.documentElement.scrollHeight - window.innerHeight;
            let scrolled = (winScroll / height) * 100;
            let bar = document.getElementById("readProgressBar");
            if(bar) bar.style.width = scrolled + "%";
        };
        window.addEventListener("scroll", window.onReaderScroll);
    }

    function showPage(page) {
        window.removeEventListener("scroll", window.onReaderScroll);
        document.querySelectorAll("#homePage, #explorePage, #mylibraryPage, #publishPage, #detailPage, #readingPage, #profilePage").forEach(el => el.classList.add("hidden-page"));
        
        if(page === "home") { document.getElementById("homePage").classList.remove("hidden-page"); renderHome(); }
        else if(page === "explore") { document.getElementById("explorePage").classList.remove("hidden-page"); renderExplore(); }
        else if(page === "mylibrary") { document.getElementById("mylibraryPage").classList.remove("hidden-page"); renderLibrary(); }
        else if(page === "publish") showPublishPage();
        else if(page === "detail") document.getElementById("detailPage").classList.remove("hidden-page");
        else if(page === "reading") document.getElementById("readingPage").classList.remove("hidden-page");
        else if(page === "profile") document.getElementById("profilePage").classList.remove("hidden-page");
        window.scrollTo(0,0);
    }
    function renderAll() { renderHome(); }
    function toggleDarkMode() { document.body.classList.toggle("dark"); localStorage.setItem("darkMode", document.body.classList.contains("dark")); }

    document.querySelectorAll(".nav-link").forEach(link => {
        link.addEventListener("click", (e) => {
            let page = e.currentTarget.dataset.page;
            showPage(page);
        });
    });

    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        updateAuthUI();
        if(user) await loadUserData();
        await loadBooks();
    });

    if(localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");
    window.toggleDarkMode = toggleDarkMode;
    window.rateBook = rateBook; window.toggleFav = toggleFav; window.showDetail = showDetail;
    window.addComment = addComment; window.deleteComment = deleteComment; window.openReader = openReader;
    window.publishBook = publishBook; window.setFilterExplore = setFilterExplore; window.setSortExplore = setSortExplore;
    window.filterExplore = filterExplore; window.goExplore = goExplore; window.setFilter = setFilter;
    window.openSignInModal = openSignInModal; window.login = login; window.register = register;
    window.showRegister = showRegister; window.closeModal = closeModal; window.signOut = signOut;
    window.signInWithGoogle = signInWithGoogle; window.showProfile = showProfile;
</script>
</body>
</html>
