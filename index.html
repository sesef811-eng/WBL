<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>منصة كتب | عالم القراءة التفاعلي</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ---------- التصميم العام ---------- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-page: #f7f9fc;
            --bg-card: #ffffff;
            --text-main: #1e2a3e;
            --text-dim: #4a5b6e;
            --border: #e2edf2;
            --primary: #8b5cf6;
            --primary-dark: #6d28d9;
            --accent: #0ea5e9;
            --warning: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
            --radius-card: 1rem;
        }
        body.dark {
            --bg-page: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-dim: #cbd5e1;
            --border: #334155;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-page);
            color: var(--text-main);
            transition: background 0.2s, color 0.2s;
            line-height: 1.5;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* الهيدر */
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }
        .header-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav {
            display: flex;
            gap: 1.8rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav a {
            text-decoration: none;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .nav a.active, .nav a:hover { color: var(--primary); }
        .theme-btn, .btn-icon {
            background: none;
            border: 1px solid var(--border);
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            color: var(--text-dim);
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        /* شبكة الكتب - 3 أعمدة جوال / 6 كمبيوتر */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
            margin: 2rem 0;
        }
        @media (min-width: 768px) { .books-grid { grid-template-columns: repeat(4, 1fr); gap: 1.5rem; } }
        @media (min-width: 1024px) { .books-grid { grid-template-columns: repeat(6, 1fr); } }
        .book-card {
            background: var(--bg-card);
            border-radius: var(--radius-card);
            overflow: hidden;
            transition: all 0.25s ease;
            cursor: pointer;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .cover {
            aspect-ratio: 2/3;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .badge {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            padding: 0.2rem 0.7rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            color: white;
        }
        .fav-icon {
            position: absolute;
            bottom: 0.5rem;
            right: 0.5rem;
            background: rgba(0,0,0,0.6);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: white;
            transition: 0.2s;
        }
        .fav-icon.active { color: var(--danger); background: rgba(0,0,0,0.8); }
        .card-info {
            padding: 0.7rem 0.5rem;
            text-align: center;
        }
        .stars {
            color: var(--warning);
            font-size: 0.75rem;
            margin: 0.3rem 0;
        }
        /* نماذج تسجيل الدخول الاحترافية */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-content {
            background: var(--bg-card);
            border-radius: 2rem;
            padding: 2rem;
            width: 90%;
            max-width: 460px;
            box-shadow: var(--shadow-md);
        }
        .form-group { margin-bottom: 1.2rem; }
        input, textarea, select {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 2rem;
            border: 1px solid var(--border);
            background: var(--bg-page);
            color: var(--text-main);
            font-family: inherit;
        }
        .btn {
            padding: 0.6rem 1.5rem;
            border-radius: 2rem;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 2rem;
            background: var(--success);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            z-index: 1100;
            font-size: 0.9rem;
            box-shadow: var(--shadow-md);
        }
        .hidden { display: none; }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin: 2rem 0 1rem;
            border-right: 4px solid var(--primary);
            padding-right: 1rem;
        }
        /* وضع القراءة */
        .reader-mode {
            max-width: 800px;
            margin: 0 auto;
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 2rem;
            line-height: 1.8;
        }
        .reader-controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border);
            margin-top: 3rem;
            color: var(--text-dim);
        }
        @media (max-width: 640px) { .container { padding: 0 1rem; } }
        /* تأثيرات إضافية */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            z-index: 10000;
            transition: width 0.2s;
        }
        .focus-mode .reader-mode {
            background: #fef9e3;
            color: #2c2c2c;
        }
        body.focus-mode { background: #fef9e3; }
    </style>
</head>
<body>
<div class="progress-bar" id="progressBar"></div>
<div class="header">
    <div class="container header-inner">
        <div class="logo" onclick="navigate('home')"><i class="fas fa-book-open"></i> منصة كتب | عالم القراءة</div>
        <div class="nav">
            <a onclick="navigate('home')">الرئيسية</a>
            <a onclick="navigate('explore')">استكشاف</a>
            <a onclick="navigate('mylibrary')">مكتبتي</a>
            <a onclick="navigate('publish')">نشر عمل</a>
            <a onclick="navigate('messages')">رسائل</a>
            <div id="authArea"></div>
            <button class="theme-btn" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
        </div>
    </div>
</div>
<main class="container" id="app">
    <div id="homePage"><div id="homeContent"></div></div>
    <div id="explorePage" class="hidden"><div id="exploreContent"></div></div>
    <div id="mylibraryPage" class="hidden"><div id="libraryContent"></div></div>
    <div id="publishPage" class="hidden"><div id="publishContent"></div></div>
    <div id="profilePage" class="hidden"><div id="profileContent"></div></div>
    <div id="bookDetailPage" class="hidden"><div id="detailContent"></div></div>
    <div id="readerPage" class="hidden"><div id="readerContent"></div></div>
    <div id="adminPage" class="hidden"><div id="adminContent"></div></div>
    <div id="messagesPage" class="hidden"><div id="messagesContent"></div></div>
</main>
<footer>© 2025 منصة كتب - تجربة قراءة متكاملة | جميع الحقوق محفوظة</footer>

<script src="firebase-config.js"></script>
<script>
    // ---------------------- الإعدادات والمتغيرات العامة ----------------------
    let currentUser = null;
    let allBooks = [];
    let userFav = [];          // المفضلة
    let readingProgress = {};  // تقدم القراءة { bookId: { page: 0, percentage: 0 } }
    let userStats = { booksRead: 0, badges: [], weeklyGoal: 0 };
    let userFollows = [];      // المؤلفون الذين يتابعهم
    let currentFilter = "all";
    let currentSort = "popular";
    let searchQuery = "";
    let selectedGenres = [];
    const genresList = ["رواية", "تعليمية", "مانغا", "مانهوا", "أكشن", "فانتازيا", "رومانسية", "رعب", "خيال علمي", "دراما", "تاريخية", "سيرة"];

    // دوال مساعدة
    function showToast(msg, isError = false) {
        let t = document.createElement("div");
        t.className = "toast";
        t.style.background = isError ? "#ef4444" : "#10b981";
        t.innerHTML = `<i class="fas fa-${isError ? 'exclamation-triangle' : 'check-circle'}"></i> ${msg}`;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 3000);
    }
    function setProgress(percent) { document.getElementById("progressBar").style.width = percent + "%"; }

    // تحميل الكتب من Firestore وإنشاء بيانات افتراضية إذا كانت فارغة
    async function loadBooks() {
        setProgress(20);
        const snap = await db.collection("books").limit(500).get();
        if (snap.empty) {
            const demo = [
                { title: "أسطورة التنين الأزرق", author: "لي جون", description: "رواية أكشن وفانتازيا ملحمية", genres: ["رواية", "أكشن", "فانتازيا"], cover: "https://picsum.photos/id/104/300/450", rating: 4.7, views: 3400, status: "مستمر", type: "رواية", series: "عالم التنين" },
                { title: "مانجا الظلام", author: "تاكيشي", description: "مانغا رعب وغموض", genres: ["مانغا", "رعب"], cover: "https://picsum.photos/id/106/300/450", rating: 4.2, views: 2100, status: "مكتمل", type: "مانغa" },
                { title: "عالم البرمجة من الصفر", author: "د. سامر", description: "كتاب تعليمي شامل", genres: ["تعليمية", "تقنية"], cover: "https://picsum.photos/id/0/300/450", rating: 4.9, views: 5600, status: "مكتمل", type: "تعليمية" },
                { title: "مانهوا الأقدار", author: "بارك جي وون", description: "مانهوا خيالية ساحرة", genres: ["مانهوا", "فانتازيا"], cover: "https://picsum.photos/id/26/300/450", rating: 4.5, views: 1870, status: "مستمر", type: "مانهوا" }
            ];
            for (let b of demo) {
                await db.collection("books").add({
                    ...b,
                    createdAt: new Date(),
                    chapters: [{ title: "الفصل الأول", content: "محتوى تجريبي للكتاب... يمكنك إضافة فصول حقيقية لاحقاً." }],
                    commentCount: 0,
                    ratingCount: 100
                });
            }
            showToast("تم تجهيز المكتبة بـ 100+ كتاب تجريبي");
        }
        const newSnap = await db.collection("books").get();
        allBooks = newSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        setProgress(100);
        setTimeout(() => setProgress(0), 300);
        renderCurrentPage();
    }

    async function loadUserData() {
        if (!currentUser) return;
        const favSnap = await db.collection("favorites").doc(currentUser.uid).get();
        userFav = favSnap.exists ? favSnap.data().bookIds : [];
        const progSnap = await db.collection("readingProgress").doc(currentUser.uid).get();
        readingProgress = progSnap.exists ? progSnap.data().progress : {};
        const userSnap = await db.collection("users").doc(currentUser.uid).get();
        if (userSnap.exists) {
            userStats = userSnap.data().stats || { booksRead: 0, badges: [] };
            userFollows = userSnap.data().follows || [];
        }
    }

    function updateAuthUI() {
        const area = document.getElementById("authArea");
        if (currentUser) {
            let name = currentUser.displayName || currentUser.email.split('@')[0];
            area.innerHTML = `<div class="avatar" onclick="navigate('profile')">${name.charAt(0).toUpperCase()}</div>`;
        } else {
            area.innerHTML = `<button class="btn-outline btn" onclick="openAuthModal()">تسجيل الدخول</button>`;
        }
    }

    // التنقل بين الصفحات (SPA)
    function navigate(page) {
        document.querySelectorAll("#app > div").forEach(div => div.classList.add("hidden"));
        document.getElementById(page + "Page").classList.remove("hidden");
        if (page === "home") renderHome();
        else if (page === "explore") renderExplore();
        else if (page === "mylibrary") renderLibrary();
        else if (page === "publish") renderPublish();
        else if (page === "profile") renderProfile();
        else if (page === "admin") renderAdmin();
        else if (page === "messages") renderMessages();
        window.scrollTo(0, 0);
    }

    // عرض البطاقة
    function bookCard(book, isFav = null) {
        let fav = (isFav !== null) ? isFav : userFav.includes(book.id);
        let stars = "★".repeat(Math.floor(book.rating || 0)) + "☆".repeat(5 - Math.floor(book.rating || 0));
        return `<div class="book-card" onclick="showBookDetail('${book.id}')">
            <div class="cover" style="background-image:url('${book.cover || 'https://picsum.photos/id/20/300/450'}')">
                <div class="badge">${book.status || 'مستمر'}</div>
                <div class="fav-icon ${fav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${book.id}')"><i class="fas fa-heart"></i></div>
            </div>
            <div class="card-info"><div><strong>${book.title.slice(0, 22)}</strong></div><div style="font-size:0.75rem;">${book.author}</div><div class="stars">${stars} (${(book.rating || 0).toFixed(1)})</div><div><i class="fas fa-eye"></i> ${book.views || 0}</div></div>
        </div>`;
    }

    async function toggleFavorite(bookId) {
        if (!currentUser) { openAuthModal(); return; }
        const favRef = db.collection("favorites").doc(currentUser.uid);
        if (userFav.includes(bookId)) {
            userFav = userFav.filter(id => id !== bookId);
            await favRef.set({ bookIds: userFav });
            showToast("تمت الإزالة من المفضلة");
        } else {
            userFav.push(bookId);
            await favRef.set({ bookIds: userFav });
            showToast("أضيفت إلى مفضلتك ❤️");
            // إشعار: يمكن إرسال إشعار للمؤلف (اختياري)
        }
        renderCurrentPage();
    }

    // الصفحة الرئيسية
    function renderHome() {
        let latest = [...allBooks].sort((a,b)=> (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0)).slice(0,12);
        let topRated = [...allBooks].sort((a,b)=> (b.rating||0) - (a.rating||0)).slice(0,12);
        let trending = [...allBooks].sort((a,b)=> (b.views||0) - (a.views||0)).slice(0,12);
        let suggestions = [];
        if (currentUser && userFav.length) {
            let favGenres = allBooks.filter(b=>userFav.includes(b.id)).flatMap(b=>b.genres || []);
            suggestions = allBooks.filter(b => !userFav.includes(b.id) && b.genres?.some(g=>favGenres.includes(g))).slice(0,12);
        } else suggestions = [...allBooks].sort(()=>0.5-Math.random()).slice(0,12);
        document.getElementById("homeContent").innerHTML = `
            <div class="section-title"><i class="fas fa-fire"></i> أحدث الكتب</div><div class="books-grid">${latest.map(bookCard).join('')}</div>
            <div class="section-title"><i class="fas fa-star"></i> الأعلى تقييماً</div><div class="books-grid">${topRated.map(bookCard).join('')}</div>
            <div class="section-title"><i class="fas fa-chart-line"></i> الأكثر قراءة</div><div class="books-grid">${trending.map(bookCard).join('')}</div>
            <div class="section-title"><i class="fas fa-lightbulb"></i> نوصي لك</div><div class="books-grid">${suggestions.map(bookCard).join('')}</div>
        `;
    }

    // صفحة الاستكشاف (بحث، فلتر، ترتيب)
    function renderExplore() {
        let filtered = allBooks.filter(b => currentFilter === "all" || (b.genres || []).includes(currentFilter));
        if (searchQuery) filtered = filtered.filter(b => b.title.includes(searchQuery) || b.author.includes(searchQuery) || (b.series && b.series.includes(searchQuery)));
        let sorted = [...filtered];
        if (currentSort === "newest") sorted.sort((a,b)=> (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0));
        else if (currentSort === "top") sorted.sort((a,b)=> (b.rating||0) - (a.rating||0));
        else sorted.sort((a,b)=> (b.views||0) - (a.views||0));
        let genreBtns = ["all", ...new Set(allBooks.flatMap(b=>b.genres||[]))].map(g => `<button class="btn-outline btn" style="margin:4px;${currentFilter===g?'background:var(--primary);color:white;':''}" onclick="setExploreFilter('${g}')">${g==='all'?'الكل':g}</button>`).join('');
        document.getElementById("exploreContent").innerHTML = `
            <div style="display:flex; gap:12px; margin:20px 0;"><input type="text" id="searchExplore" placeholder="ابحث باسم الكتاب، المؤلف، السلسلة..." style="flex:1;" oninput="updateSearch()"><button class="btn" onclick="updateSearch()"><i class="fas fa-search"></i></button></div>
            <div>${genreBtns}</div>
            <div style="margin:12px 0;"><button class="btn-outline btn ${currentSort==='newest'?'active':''}" onclick="setExploreSort('newest')">الأحدث</button><button class="btn-outline btn ${currentSort==='top'?'active':''}" onclick="setExploreSort('top')">الأعلى تقييماً</button><button class="btn-outline btn ${currentSort==='popular'?'active':''}" onclick="setExploreSort('popular')">الأكثر شهرة</button></div>
            <div class="books-grid" id="exploreGrid">${sorted.map(bookCard).join('')}</div>
        `;
    }
    window.setExploreFilter = (f) => { currentFilter = f; renderExplore(); };
    window.setExploreSort = (s) => { currentSort = s; renderExplore(); };
    window.updateSearch = () => { searchQuery = document.getElementById("searchExplore")?.value || ""; renderExplore(); };

    // مكتبتي (مفضلة، قيد القراءة، مكتملة، سأقرأها لاحقاً)
    function renderLibrary() {
        let favBooks = allBooks.filter(b => userFav.includes(b.id));
        let readingBooks = allBooks.filter(b => readingProgress[b.id] && readingProgress[b.id].percentage < 100);
        let completedBooks = allBooks.filter(b => readingProgress[b.id]?.percentage === 100);
        let willRead = []; // يمكن تخزينها في Firestore كقائمة منفصلة
        document.getElementById("libraryContent").innerHTML = `
            <div class="section-title"><i class="fas fa-heart"></i> المفضلة</div><div class="books-grid">${favBooks.map(b=>bookCard(b,true)).join('')||"<p>لا توجد كتب مفضلة</p>"}</div>
            <div class="section-title"><i class="fas fa-book-open"></i> قيد القراءة</div><div class="books-grid">${readingBooks.map(bookCard).join('')||"<p>ابدأ بقراءة كتاب</p>"}</div>
            <div class="section-title"><i class="fas fa-check-circle"></i> مكتملة</div><div class="books-grid">${completedBooks.map(bookCard).join('')||"<p>لم تنتهِ من أي كتاب بعد</p>"}</div>
            <div class="section-title"><i class="fas fa-clock"></i> سأقرأها لاحقاً</div><div class="books-grid">${willRead.map(bookCard).join('')||"<p>أضف كتباً لقائمة الانتظار</p>"}</div>
        `;
    }

    // نشر كتاب (للمؤلفين)
    function renderPublish() {
        if (!currentUser) { openAuthModal(); return; }
        document.getElementById("publishContent").innerHTML = `
            <div style="background:var(--bg-card); border-radius:2rem; padding:2rem;">
                <h2>📚 نشر كتاب جديد</h2>
                <div class="form-group"><input id="pubTitle" placeholder="عنوان الكتاب"></div>
                <div class="form-group"><textarea id="pubDesc" rows="3" placeholder="وصف مختصر"></textarea></div>
                <div class="form-group"><div id="genresPicker" style="display:flex; flex-wrap:wrap; gap:8px;"></div></div>
                <div class="form-group"><input id="pubCover" placeholder="رابط صورة الغلاف (URL)"></div>
                <div class="form-group"><select id="pubStatus"><option>مستمر</option><option>مكتمل</option></select></div>
                <div class="form-group"><input id="pubSeries" placeholder="اسم السلسلة (اختياري)"></div>
                <h3>الفصول</h3><div id="chaptersContainer"></div>
                <button class="btn-outline btn" onclick="addChapterField()">+ إضافة فصل</button><br><br>
                <button class="btn" onclick="publishNewBook()">نشر الكتاب</button>
            </div>
        `;
        renderGenreButtons();
        window.chaptersArr = [];
    }

    function renderGenreButtons() {
        let container = document.getElementById("genresPicker");
        if (!container) return;
        container.innerHTML = genresList.map(g => `<button type="button" class="genre-opt" data-g="${g}" onclick="toggleGenrePublish('${g}')" style="padding:0.3rem 1rem; border-radius:2rem; border:1px solid var(--border); background:var(--bg-page); margin:4px;">${g}</button>`).join('');
    }
    window.toggleGenrePublish = (g) => {
        let btn = document.querySelector(`.genre-opt[data-g="${g}"]`);
        if (selectedGenres.includes(g)) {
            selectedGenres = selectedGenres.filter(x => x !== g);
            btn.style.background = "var(--bg-page)";
            btn.style.color = "var(--text-main)";
        } else {
            selectedGenres.push(g);
            btn.style.background = "var(--primary)";
            btn.style.color = "white";
        }
    };
    window.addChapterField = () => {
        let idx = window.chaptersArr.length;
        let container = document.getElementById("chaptersContainer");
        container.insertAdjacentHTML('beforeend', `<div class="form-group" data-chapter="${idx}"><input placeholder="عنوان الفصل" id="chapTitle${idx}"><textarea placeholder="محتوى الفصل..." rows="2" id="chapContent${idx}"></textarea><button class="btn-outline" onclick="removeChapter(${idx})">حذف</button></div>`);
        window.chaptersArr.push({ title: "", content: "" });
    };
    window.removeChapter = (idx) => { document.querySelector(`.form-group[data-chapter="${idx}"]`).remove(); window.chaptersArr.splice(idx,1); };
    async function publishNewBook() {
        let title = document.getElementById("pubTitle").value.trim();
        let desc = document.getElementById("pubDesc").value.trim();
        if (!title || !desc) { showToast("العنوان والوصف مطلوبان", true); return; }
        let cover = document.getElementById("pubCover").value.trim() || "https://picsum.photos/id/20/300/450";
        let status = document.getElementById("pubStatus").value;
        let series = document.getElementById("pubSeries").value.trim();
        let chapters = [];
        for (let i=0; i<window.chaptersArr.length; i++) {
            let ct = document.getElementById(`chapTitle${i}`)?.value;
            let cc = document.getElementById(`chapContent${i}`)?.value;
            if (ct && cc) chapters.push({ title: ct, content: cc });
        }
        if (chapters.length === 0) chapters.push({ title: "الفصل الأول", content: "بداية القصة..." });
        let newBook = {
            title, description: desc, author: currentUser.displayName || currentUser.email.split('@')[0],
            authorId: currentUser.uid, genres: selectedGenres, cover, status, series: series || "",
            chapters, views: 0, rating: 0, ratingCount: 0, commentCount: 0, createdAt: new Date()
        };
        await db.collection("books").add(newBook);
        showToast("تم نشر كتابك بنجاح! 🎉");
        selectedGenres = [];
        window.chaptersArr = [];
        await loadBooks();
        navigate("home");
    }

    // عرض تفاصيل الكتاب مع تعليقات وتقييم
    async function showBookDetail(bookId) {
        let book = allBooks.find(b=>b.id===bookId);
        if (!book) return;
        await db.collection("books").doc(bookId).update({ views: firebase.firestore.FieldValue.increment(1) });
        book.views++;
        let commentsSnap = await db.collection("comments").where("bookId","==",bookId).orderBy("createdAt","desc").limit(50).get();
        let comments = commentsSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        let ratingStarsHtml = "";
        for (let i=1;i<=5;i++) ratingStarsHtml += `<i class="fas fa-star" style="color:${i<=Math.floor(book.rating||0)?'var(--warning)':'#ccc'}; cursor:pointer; margin:0 2px;" onclick="rateBook('${bookId}',${i})"></i>`;
        document.getElementById("detailContent").innerHTML = `
            <div style="background:var(--bg-card); border-radius:2rem; padding:2rem;">
                <div style="display:flex; gap:2rem; flex-wrap:wrap;"><div style="width:180px; height:270px; background-image:url('${book.cover}'); background-size:cover; border-radius:1rem;"></div><div><h1>${book.title}</h1><p>✍️ ${book.author}</p><p>${book.description}</p><div>${(book.genres||[]).map(g=>`<span style="background:var(--primary); padding:0.2rem 0.8rem; border-radius:2rem; color:white; margin:0.2rem; display:inline-block;">${g}</span>`).join('')}</div><div>${ratingStarsHtml} (${(book.rating||0).toFixed(1)}) | 👁️ ${book.views}</div><button class="btn" onclick="openReader('${bookId}')"><i class="fas fa-book-open"></i> اقرأ</button><button class="btn-outline btn" onclick="toggleFavorite('${bookId}')"><i class="fas fa-heart"></i> ${userFav.includes(bookId)?'مفضلة':'أضف'}</button><button class="btn-outline btn" onclick="followAuthor('${book.authorId}')"><i class="fas fa-user-plus"></i> متابعة المؤلف</button></div></div>
                <div style="margin-top:2rem;"><h3>التعليقات</h3><textarea id="newComment" rows="2" style="width:100%; border-radius:1rem;"></textarea><button class="btn" onclick="addComment('${bookId}')">نشر تعليق</button><div id="commentsList">${comments.map(c=>`<div style="border-bottom:1px solid var(--border); padding:0.6rem;"><strong>${c.userName}</strong><p>${c.text}</p><small>${c.createdAt?.toDate().toLocaleString()}</small></div>`).join('')}</div></div>
            </div>
        `;
        navigate("bookDetail");
    }
    window.rateBook = async (bookId, rating) => {
        if (!currentUser) { openAuthModal(); return; }
        const bookRef = db.collection("books").doc(bookId);
        const ratingRef = db.collection("ratings").doc(`${currentUser.uid}_${bookId}`);
        const existing = await ratingRef.get();
        let delta = rating - (existing.exists ? existing.data().rating : 0);
        if (!existing.exists) await ratingRef.set({ userId: currentUser.uid, bookId, rating });
        else await ratingRef.update({ rating });
        const bookDoc = await bookRef.get();
        let newSum = (bookDoc.data().ratingSum || 0) + delta;
        let newCount = (bookDoc.data().ratingCount || 0) + (existing.exists ? 0 : 1);
        let newAvg = newCount > 0 ? newSum / newCount : 0;
        await bookRef.update({ rating: newAvg, ratingCount: newCount, ratingSum: newSum });
        showToast(`قيمت الكتاب بـ ${rating} نجوم ⭐`);
        await loadBooks();
        showBookDetail(bookId);
    };
    window.addComment = async (bookId) => {
        if (!currentUser) { openAuthModal(); return; }
        let text = document.getElementById("newComment")?.value.trim();
        if (!text) return;
        await db.collection("comments").add({
            bookId, userId: currentUser.uid, userName: currentUser.displayName || currentUser.email.split('@')[0],
            text, createdAt: new Date()
        });
        await db.collection("books").doc(bookId).update({ commentCount: firebase.firestore.FieldValue.increment(1) });
        showToast("تم إضافة تعليقك");
        showBookDetail(bookId);
    };
    window.followAuthor = async (authorId) => {
        if (!currentUser) { openAuthModal(); return; }
        if (!userFollows.includes(authorId)) {
            userFollows.push(authorId);
            await db.collection("users").doc(currentUser.uid).set({ follows: userFollows }, { merge: true });
            showToast("بدأت متابعة هذا المؤلف");
        } else showToast("أنت تتابعه بالفعل");
    };

    // قارئ متقدم مع حفظ التقدم
    function openReader(bookId) {
        let book = allBooks.find(b=>b.id===bookId);
        if (!book.chapters || !book.chapters.length) { showToast("لا توجد فصول بعد", true); return; }
        let savedPage = readingProgress[bookId]?.page || 0;
        let html = `<div class="reader-controls">
            <button class="btn-outline btn" onclick="changeFontSize('inc')">A+</button><button class="btn-outline btn" onclick="changeFontSize('dec')">A-</button>
            <button class="btn-outline btn" onclick="toggleFocusMode()">وضع التركيز</button>
            <button class="btn" onclick="saveProgressAndExit('${bookId}')">حفظ والعودة</button>
        </div>`;
        html += `<div class="reader-mode" id="readerMode">`;
        book.chapters.forEach((ch, idx) => {
            html += `<div class="chapter" data-chapter="${idx}"><h3>${ch.title}</h3><div>${ch.content}</div></div>`;
        });
        html += `</div>`;
        document.getElementById("readerContent").innerHTML = html;
        navigate("reader");
        // استعادة آخر موضع
        setTimeout(() => {
            let scrollPos = savedPage;
            window.scrollTo(0, scrollPos);
        }, 100);
        // حفظ التقدم أثناء التمرير
        window.addEventListener("scroll", function onScroll() {
            let scrollPos = window.scrollY;
            db.collection("readingProgress").doc(currentUser?.uid).set({
                progress: { ...readingProgress, [bookId]: { page: scrollPos, percentage: Math.min(100, Math.floor((scrollPos / (document.body.scrollHeight - window.innerHeight)) * 100)) } }
            }, { merge: true });
        });
    }
    window.saveProgressAndExit = (bookId) => { navigate("bookDetail"); showBookDetail(bookId); };
    window.changeFontSize = (op) => { let el = document.querySelector(".reader-mode"); if(el){ let size = parseFloat(getComputedStyle(el).fontSize); el.style.fontSize = (op==='inc'?size+2:size-2)+"px"; } };
    window.toggleFocusMode = () => { document.body.classList.toggle("focus-mode"); };

    // الملف الشخصي
    async function renderProfile() {
        if (!currentUser) { openAuthModal(); return; }
        let userDoc = await db.collection("users").doc(currentUser.uid).get();
        let bio = userDoc.exists ? userDoc.data().bio : "قارئ شغوف";
        let avatarUrl = userDoc.exists ? userDoc.data().avatar : null;
        document.getElementById("profileContent").innerHTML = `
            <div style="background:var(--bg-card); border-radius:2rem; padding:2rem; text-align:center;">
                <div class="avatar" style="width:100px; height:100px; font-size:3rem; margin:0 auto; background-image:url('${avatarUrl || ''}'); background-size:cover;">${!avatarUrl ? (currentUser.displayName||currentUser.email).charAt(0).toUpperCase() : ''}</div>
                <h2>${currentUser.displayName || currentUser.email.split('@')[0]}</h2>
                <p>${currentUser.email}</p>
                <div class="form-group"><textarea id="bioInput" rows="2" placeholder="نبذة عنك">${bio}</textarea><button class="btn" onclick="updateBio()">تحديث النبذة</button></div>
                <div class="form-group"><input type="file" id="avatarUpload" accept="image/*"><button class="btn" onclick="uploadAvatar()">رفع صورة</button></div>
                <div><strong>المفضلة:</strong> ${userFav.length} | <strong>مقروء:</strong> ${Object.keys(readingProgress).length}</div>
                <div>الشارات: ${userStats.badges?.join(", ") || "لا توجد"}</div>
                <div>المؤلفون المتابعون: ${userFollows.length}</div>
                <button class="btn-outline btn" onclick="signOut()">تسجيل خروج</button>
            </div>
        `;
    }
    window.updateBio = async () => { let bio = document.getElementById("bioInput").value; await db.collection("users").doc(currentUser.uid).set({ bio }, { merge: true }); showToast("تم تحديث النبذة"); };
    window.uploadAvatar = async () => {
        let file = document.getElementById("avatarUpload").files[0];
        if (!file) return;
        let storageRef = firebase.storage().ref();
        let avatarRef = storageRef.child(`avatars/${currentUser.uid}`);
        await avatarRef.put(file);
        let url = await avatarRef.getDownloadURL();
        await db.collection("users").doc(currentUser.uid).set({ avatar: url }, { merge: true });
        showToast("تم تحديث الصورة");
        renderProfile();
    };

    // رسائل خاصة
    async function renderMessages() {
        if (!currentUser) { openAuthModal(); return; }
        let msgsSnap = await db.collection("messages").where("to", "==", currentUser.uid).orderBy("timestamp", "desc").limit(50).get();
        let msgs = msgsSnap.docs.map(d => d.data());
        document.getElementById("messagesContent").innerHTML = `
            <div style="background:var(--bg-card); border-radius:2rem; padding:2rem;">
                <h2>الرسائل الخاصة</h2>
                <div id="msgList">${msgs.map(m => `<div><strong>${m.fromName}</strong>: ${m.text}</div>`).join('')}</div>
                <div class="form-group"><input id="msgTo" placeholder="معرف المستخدم المرسل إليه"><textarea id="msgText" placeholder="نص الرسالة"></textarea><button class="btn" onclick="sendMessage()">إرسال</button></div>
            </div>
        `;
    }
    window.sendMessage = async () => {
        let toId = document.getElementById("msgTo").value.trim();
        let text = document.getElementById("msgText").value.trim();
        if (!toId || !text) return;
        await db.collection("messages").add({ from: currentUser.uid, fromName: currentUser.displayName, to: toId, text, timestamp: new Date() });
        showToast("تم الإرسال");
        renderMessages();
    };

    // لوحة تحكم المشرف (حذف محتوى)
    async function renderAdmin() {
        if (!currentUser || currentUser.email !== "admin@example.com") { showToast("غير مصرح", true); navigate("home"); return; }
        let booksSnap = await db.collection("books").get();
        let booksList = booksSnap.docs.map(d => ({ id: d.id, title: d.data().title }));
        document.getElementById("adminContent").innerHTML = `
            <div style="background:var(--bg-card); border-radius:2rem; padding:2rem;">
                <h2>لوحة التحكم</h2>
                <div>الكتب: ${booksList.map(b => `<div>${b.title} <button class="btn-outline btn" onclick="deleteBook('${b.id}')">حذف</button></div>`).join('')}</div>
            </div>
        `;
    }
    window.deleteBook = async (id) => { await db.collection("books").doc(id).delete(); showToast("تم الحذف"); loadBooks(); };

    // المصادقة (نافذة احترافية)
    function openAuthModal() {
        document.body.insertAdjacentHTML('beforeend', `
            <div id="authModal" class="modal active">
                <div class="modal-content"><h2>مرحباً بك في منصة كتب</h2>
                <div class="form-group"><input id="loginEmail" placeholder="البريد الإلكتروني"></div>
                <div class="form-group"><input id="loginPassword" type="password" placeholder="كلمة السر"></div>
                <button class="btn" onclick="emailLogin()">تسجيل الدخول</button>
                <div style="margin:12px 0; text-align:center;">أو</div>
                <button class="btn-outline btn" onclick="signInWithGoogle()" style="width:100%;"><i class="fab fa-google"></i> Google</button>
                <button class="btn-outline btn" onclick="showRegisterModal()" style="margin-top:12px;">إنشاء حساب جديد</button>
                <button class="btn-outline btn" onclick="guestLogin()" style="margin-top:12px;">دخول كضيف</button>
                <button class="btn-outline btn" onclick="closeModal()" style="margin-top:12px;">إلغاء</button></div>
            </div>
        `);
    }
    async function emailLogin() {
        let email = document.getElementById("loginEmail").value.trim();
        let pwd = document.getElementById("loginPassword").value.trim();
        try { let cred = await auth.signInWithEmailAndPassword(email,pwd); currentUser=cred.user; await loadUserData(); updateAuthUI(); closeModal(); showToast(`مرحباً ${currentUser.displayName||currentUser.email}`); await loadBooks(); } catch(e){ showToast(e.message, true); }
    }
    function showRegisterModal() { closeModal(); document.body.insertAdjacentHTML('beforeend', `<div id="authModal" class="modal active"><div class="modal-content"><h3>حساب جديد</h3><div class="form-group"><input id="regName" placeholder="الاسم"></div><div class="form-group"><input id="regEmail" placeholder="البريد"></div><div class="form-group"><input id="regPassword" type="password" placeholder="كلمة سر"></div><button class="btn" onclick="registerWithEmail()">تسجيل</button><button class="btn-outline btn" onclick="openAuthModal()">عودة</button></div></div>`); }
    async function registerWithEmail() { let name=document.getElementById("regName").value.trim(); let email=document.getElementById("regEmail").value.trim(); let pwd=document.getElementById("regPassword").value.trim(); if(!name||!email||pwd.length<6){showToast("بيانات غير صالحة",true);return;} try{ let cred=await auth.createUserWithEmailAndPassword(email,pwd); await cred.user.updateProfile({displayName:name}); currentUser=cred.user; await db.collection("users").doc(currentUser.uid).set({username:name, email, bio:"قارئ جديد", stats:{booksRead:0,badges:[]}}); await loadUserData(); updateAuthUI(); closeModal(); showToast(`مرحباً ${name}`); await loadBooks(); }catch(e){showToast(e.message,true);} }
    async function signInWithGoogle() { try { let result = await auth.signInWithPopup(googleProvider); currentUser=result.user; let userDoc=await db.collection("users").doc(currentUser.uid).get(); if(!userDoc.exists) await db.collection("users").doc(currentUser.uid).set({username:currentUser.displayName, email:currentUser.email, bio:"", stats:{booksRead:0,badges:[]}}); await loadUserData(); updateAuthUI(); closeModal(); showToast(`مرحباً ${currentUser.displayName}`); await loadBooks(); } catch(e){ showToast("تفعيل Google في Firebase Console", true); } }
    async function guestLogin() { let guestEmail=`guest_${Date.now()}@temp.com`; let pass=Math.random().toString(36); try{ let cred=await auth.createUserWithEmailAndPassword(guestEmail,pass); await cred.user.updateProfile({displayName:"زائر"}); currentUser=cred.user; await db.collection("users").doc(currentUser.uid).set({username:"زائر", email:guestEmail, bio:"", stats:{}}); await loadUserData(); updateAuthUI(); closeModal(); showToast("أهلاً بك ضيفنا"); await loadBooks(); } catch(e){ showToast(e.message, true); } }
    function closeModal() { document.querySelector(".modal")?.remove(); }
    async function signOut() { await auth.signOut(); currentUser=null; userFav=[]; readingProgress={}; updateAuthUI(); showToast("تم الخروج"); await loadBooks(); navigate("home"); }

    function toggleDarkMode() { document.body.classList.toggle("dark"); localStorage.setItem("darkMode", document.body.classList.contains("dark")); }
    if(localStorage.getItem("darkMode")==="true") document.body.classList.add("dark");

    function renderCurrentPage() {
        if (!document.getElementById("homePage").classList.contains("hidden")) renderHome();
    }

    auth.onAuthStateChanged(async (user) => { currentUser = user; updateAuthUI(); if(user) await loadUserData(); await loadBooks(); navigate("home"); });
    window.navigate = navigate; window.showBookDetail = showBookDetail; window.toggleFavorite = toggleFavorite; window.openAuthModal = openAuthModal;
    window.closeModal = closeModal; window.signOut = signOut; window.publishNewBook = publishNewBook;
</script>
</body>
</html>
