<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WBL | عالم بين سطور - منصة قراءة تفاعلية</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-card: #ffffff;
            --text-primary: #0f172a; --text-secondary: #475569; --border: #e2e8f0;
            --primary: #8b5cf6; --accent: #06b6d4; --danger: #ef4444; --rating: #fbbf24;
        }
        body.dark {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #334155;
            --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --border: #475569;
        }
        body { font-family: 'Cairo', sans-serif; background: var(--bg-primary); color: var(--text-primary); transition: 0.3s; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
        header {
            background: var(--bg-secondary); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000; padding: 12px 32px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
        }
        .logo { font-size: 26px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; color: transparent; cursor: pointer; }
        .nav-links { display: flex; gap: 28px; align-items: center; }
        .nav-link { cursor: pointer; font-weight: 600; color: var(--text-secondary); }
        .nav-link:hover { color: var(--primary); }
        .auth-area { display: flex; gap: 12px; align-items: center; }
        .user-menu { display: flex; align-items: center; gap: 8px; background: var(--bg-primary); padding: 6px 16px; border-radius: 40px; cursor: pointer; }
        .theme-toggle { background: none; border: 1px solid var(--border); padding: 8px 14px; border-radius: 40px; cursor: pointer; }
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; margin: 30px 0; }
        .book-card { background: var(--bg-card); border-radius: 16px; overflow: hidden; cursor: pointer; transition: 0.2s; border: 1px solid var(--border); }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .card-cover { aspect-ratio: 2/3; background-size: cover; background-position: center; position: relative; }
        .favorite-icon { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.6); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; }
        .favorite-icon.active { color: var(--danger); }
        .card-info { padding: 10px; text-align: center; }
        .btn { background: var(--primary); border: none; padding: 10px 20px; border-radius: 40px; color: white; cursor: pointer; font-weight: 600; }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-secondary); border-radius: 32px; padding: 32px; width: 90%; max-width: 450px; }
        .form-group { margin-bottom: 16px; }
        input, textarea { width: 100%; padding: 12px; border-radius: 28px; border: 1px solid var(--border); background: var(--bg-primary); }
        .genres-picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .genre-option { background: var(--bg-primary); padding: 6px 14px; border-radius: 30px; cursor: pointer; font-size: 12px; border: 1px solid var(--border); }
        .genre-option.active { background: var(--primary); color: white; }
        .toast { position: fixed; bottom: 20px; left: 20px; background: #10b981; color: white; padding: 12px 24px; border-radius: 48px; z-index: 3000; }
        .hidden-page { display: none; }
        .profile-header { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; background: var(--bg-secondary); padding: 24px; border-radius: 32px; margin: 20px 0; }
        .profile-avatar { width: 80px; height: 80px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; color: white; }
        @media (max-width: 768px) { .container { padding: 0 16px; } header { padding: 12px 16px; } }
    </style>
</head>
<body>
<header>
    <div class="logo" onclick="showPage('home')">📖 WBL | عالم بين سطور</div>
    <div class="nav-links">
        <a class="nav-link" onclick="showPage('home')">الرئيسية</a>
        <a class="nav-link" onclick="showPage('explore')">استكشاف</a>
        <a class="nav-link" onclick="showPage('mylibrary')">مكتبتي</a>
        <a class="nav-link" onclick="showPage('publish')">نشر عمل</a>
        <div class="auth-area" id="authArea"></div>
        <button class="theme-toggle" onclick="toggleDarkMode()"><i class="fas fa-moon"></i></button>
    </div>
</header>
<main class="container">
    <div id="homePage"><div id="homeContent"></div></div>
    <div id="explorePage" class="hidden-page"><div id="exploreContent"></div></div>
    <div id="mylibraryPage" class="hidden-page"><div id="libraryContent"></div></div>
    <div id="publishPage" class="hidden-page"><div id="publishContent"></div></div>
    <div id="profilePage" class="hidden-page"><div id="profileContent"></div></div>
    <div id="detailPage" class="hidden-page"><div id="detailContent"></div></div>
</main>
<footer style="text-align:center; padding:32px; border-top:1px solid var(--border); margin-top:40px;">© 2025 WBL - منصة قراءة تفاعلية</footer>

<script>
    // Firebase config
    const firebaseConfig = {
        apiKey: "AIzaSyBGPtZG34gQYuRHS-L6XQVD2hJzQk82Wtk",
        authDomain: "wbl-22ec7.firebaseapp.com",
        projectId: "wbl-22ec7",
        storageBucket: "wbl-22ec7.firebasestorage.app",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const googleProvider = new firebase.auth.GoogleAuthProvider();

    // متغيرات عامة
    let currentUser = null;
    let books = [];
    let userFavorites = [];
    let selectedGenres = [];
    const availableGenres = ["أكشن", "فانتازيا", "غموض", "دراما", "رومانسية", "رعب", "خيال علمي", "مغامرات"];

    // دوال مساعدة
    function showToast(msg, isError = false) {
        let toast = document.createElement("div");
        toast.className = "toast";
        toast.style.background = isError ? "#ef4444" : "#10b981";
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    // تحميل الكتب من Firestore أو إضافة بيانات افتراضية
    async function loadBooks() {
        const snapshot = await db.collection("books").get();
        if (snapshot.empty) {
            const defaultBooks = [
                { title: "أسطورة التنين", author: "لين تشن", authorId: "system", description: "قصة صياد يصبح أقوى تنين", genres: ["أكشن", "فانتازيا"], status: "مستمر", cover: "https://picsum.photos/id/104/200/300", views: 1240, rating: 4.5, ratingCount: 230, commentCount: 0, createdAt: new Date() },
                { title: "سجلات الظل", author: "ريم الغامدي", authorId: "system", description: "غموض وخيانة", genres: ["غموض", "دراما"], status: "مكتمل", cover: "https://picsum.photos/id/106/200/300", views: 890, rating: 4.2, ratingCount: 112, commentCount: 0, createdAt: new Date() }
            ];
            for (let book of defaultBooks) await db.collection("books").add(book);
            showToast("تم تجهيز المكتبة بأجمل الكتب!");
        }
        const newSnap = await db.collection("books").get();
        books = newSnap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderAll();
    }

    async function loadUserData() {
        if (!currentUser) return;
        const favDoc = await db.collection("favorites").doc(currentUser.uid).get();
        userFavorites = favDoc.exists ? favDoc.data().bookIds : [];
    }

    function updateAuthUI() {
        const authArea = document.getElementById("authArea");
        if (currentUser) {
            const name = currentUser.displayName || currentUser.email.split('@')[0];
            authArea.innerHTML = `<div class="user-menu" onclick="showPage('profile')"><i class="fas fa-user-circle"></i> ${name}</div>`;
        } else {
            authArea.innerHTML = `<button class="btn-outline btn" onclick="openAuthModal()">تسجيل الدخول</button>`;
        }
    }

    // نافذة تسجيل دخول احترافية
    function openAuthModal() {
        document.body.insertAdjacentHTML('beforeend', `
            <div id="authModal" class="modal active">
                <div class="modal-content">
                    <h2 style="text-align:center;">مرحباً بك</h2>
                    <div class="form-group"><input type="email" id="loginEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="form-group"><input type="password" id="loginPassword" placeholder="كلمة السر"></div>
                    <button class="btn" onclick="emailLogin()">تسجيل الدخول</button>
                    <div style="margin: 12px 0; text-align:center;">أو</div>
                    <button class="btn-outline btn" onclick="signInWithGoogle()" style="width:100%;"><i class="fab fa-google"></i> Google</button>
                    <button class="btn-outline btn" onclick="showRegisterModal()" style="margin-top:12px;">إنشاء حساب جديد</button>
                    <button class="btn-outline btn" onclick="guestLogin()" style="margin-top:12px;">دخول كضيف</button>
                    <button class="btn-outline btn" onclick="closeModal()" style="margin-top:12px;">إلغاء</button>
                </div>
            </div>
        `);
    }

    async function emailLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const pwd = document.getElementById("loginPassword").value.trim();
        try {
            const cred = await auth.signInWithEmailAndPassword(email, pwd);
            currentUser = cred.user;
            await loadUserData();
            updateAuthUI();
            closeModal();
            showToast(`مرحباً ${currentUser.displayName || currentUser.email}`);
            await loadBooks();
        } catch (e) { showToast(e.message, true); }
    }

    function showRegisterModal() {
        closeModal();
        document.body.insertAdjacentHTML('beforeend', `
            <div id="authModal" class="modal active">
                <div class="modal-content">
                    <h3>إنشاء حساب</h3>
                    <div class="form-group"><input id="regName" placeholder="الاسم الكامل"></div>
                    <div class="form-group"><input id="regEmail" placeholder="البريد الإلكتروني"></div>
                    <div class="form-group"><input id="regPassword" type="password" placeholder="كلمة السر"></div>
                    <button class="btn" onclick="registerWithEmail()">تسجيل</button>
                    <button class="btn-outline btn" onclick="openAuthModal()">عودة</button>
                </div>
            </div>
        `);
    }

    async function registerWithEmail() {
        const name = document.getElementById("regName").value.trim();
        const email = document.getElementById("regEmail").value.trim();
        const pwd = document.getElementById("regPassword").value.trim();
        if (!name || !email || pwd.length < 6) { showToast("املأ جميع الحروف (كلمة مرور 6+ أحرف)", true); return; }
        try {
            const cred = await auth.createUserWithEmailAndPassword(email, pwd);
            await cred.user.updateProfile({ displayName: name });
            currentUser = cred.user;
            await db.collection("users").doc(currentUser.uid).set({ username: name, email });
            await loadUserData();
            updateAuthUI();
            closeModal();
            showToast(`أهلاً ${name}`);
            await loadBooks();
        } catch (e) { showToast(e.message, true); }
    }

    async function signInWithGoogle() {
        try {
            const result = await auth.signInWithPopup(googleProvider);
            currentUser = result.user;
            const userDoc = await db.collection("users").doc(currentUser.uid).get();
            if (!userDoc.exists) await db.collection("users").doc(currentUser.uid).set({ username: currentUser.displayName, email: currentUser.email });
            await loadUserData();
            updateAuthUI();
            closeModal();
            showToast(`مرحباً ${currentUser.displayName}`);
            await loadBooks();
        } catch (e) { showToast("فشل تسجيل الدخول بجوجل: تأكد من تفعيل الخدمة في Firebase Console", true); }
    }

    async function guestLogin() {
        const guestEmail = `guest_${Date.now()}@wbl.com`;
        const guestPass = Math.random().toString(36).slice(-10);
        try {
            const cred = await auth.createUserWithEmailAndPassword(guestEmail, guestPass);
            await cred.user.updateProfile({ displayName: "ضيف WBL" });
            currentUser = cred.user;
            await db.collection("users").doc(currentUser.uid).set({ username: "ضيف", email: guestEmail });
            await loadUserData();
            updateAuthUI();
            closeModal();
            showToast("أهلاً بك كضيف!");
            await loadBooks();
        } catch (e) { showToast(e.message, true); }
    }

    function closeModal() { document.querySelector(".modal")?.remove(); }

    async function signOut() {
        await auth.signOut();
        currentUser = null;
        userFavorites = [];
        updateAuthUI();
        showToast("تم تسجيل الخروج");
        await loadBooks();
        showPage("home");
    }

    // عرض الكتب
    function renderBookCard(book, isFav) {
        const fav = (isFav !== undefined) ? isFav : userFavorites.includes(book.id);
        return `
            <div class="book-card" onclick="showDetail('${book.id}')">
                <div class="card-cover" style="background-image:url('${book.cover || 'https://picsum.photos/id/20/200/300'}')">
                    <div class="favorite-icon ${fav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFavorite('${book.id}')"><i class="fas fa-heart"></i></div>
                </div>
                <div class="card-info">
                    <div><strong>${book.title}</strong></div>
                    <div style="font-size:12px;">${book.author}</div>
                    <div style="color:var(--rating);">${"★".repeat(Math.floor(book.rating || 0))}${"☆".repeat(5-Math.floor(book.rating || 0))} (${(book.rating||0).toFixed(1)})</div>
                </div>
            </div>
        `;
    }

    async function toggleFavorite(bookId) {
        if (!currentUser) { openAuthModal(); return; }
        const favRef = db.collection("favorites").doc(currentUser.uid);
        if (userFavorites.includes(bookId)) {
            userFavorites = userFavorites.filter(id => id !== bookId);
            await favRef.set({ bookIds: userFavorites });
            showToast("أزيلت من المفضلة");
        } else {
            userFavorites.push(bookId);
            await favRef.set({ bookIds: userFavorites });
            showToast("أضيفت إلى المفضلة");
        }
        renderAll();
    }

    function renderHome() {
        const latest = [...books].sort((a,b) => (b.createdAt?.toMillis?.()||0) - (a.createdAt?.toMillis?.()||0)).slice(0,8);
        const top = [...books].sort((a,b) => (b.rating||0) - (a.rating||0)).slice(0,8);
        document.getElementById("homeContent").innerHTML = `
            <h2>🆕 أحدث الكتب</h2><div class="books-grid">${latest.map(b=>renderBookCard(b)).join('')}</div>
            <h2>⭐ الأعلى تقييماً</h2><div class="books-grid">${top.map(b=>renderBookCard(b)).join('')}</div>
        `;
    }

    function renderExplore() {
        let html = `<input type="text" id="searchInput" placeholder="ابحث عن كتاب..." style="width:100%; padding:12px; border-radius:40px; margin:20px 0;" oninput="filterExplore()">`;
        html += `<div class="books-grid" id="exploreGrid">${books.map(b=>renderBookCard(b)).join('')}</div>`;
        document.getElementById("exploreContent").innerHTML = html;
    }

    function filterExplore() {
        const term = document.getElementById("searchInput").value.toLowerCase();
        const filtered = books.filter(b => b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term));
        document.getElementById("exploreGrid").innerHTML = filtered.map(b=>renderBookCard(b)).join('');
    }

    function renderLibrary() {
        const favs = books.filter(b => userFavorites.includes(b.id));
        document.getElementById("libraryContent").innerHTML = `
            <h2>⭐ المفضلة</h2><div class="books-grid">${favs.map(b=>renderBookCard(b,true)).join('') || "<p>لا توجد كتب مفضلة</p>"}</div>
        `;
    }

    // صفحة النشر
    function showPublishPage() {
        if (!currentUser) { openAuthModal(); return; }
        document.getElementById("publishContent").innerHTML = `
            <div style="background:var(--bg-secondary); padding:24px; border-radius:32px;">
                <h2>📝 نشر كتاب جديد</h2>
                <div class="form-group"><input id="pubTitle" placeholder="عنوان الكتاب"></div>
                <div class="form-group"><textarea id="pubDesc" rows="4" placeholder="وصف الكتاب"></textarea></div>
                <div class="form-group"><label>التصنيفات</label><div id="genresPicker" class="genres-picker"></div></div>
                <div class="form-group"><input id="pubCover" placeholder="رابط صورة الغلاف (اختياري)"></div>
                <button class="btn" onclick="publishBook()">نشر</button>
            </div>
        `;
        renderGenresPicker();
    }

    function renderGenresPicker() {
        const container = document.getElementById("genresPicker");
        if (!container) return;
        container.innerHTML = availableGenres.map(g => `<button type="button" class="genre-option" data-genre="${g}" onclick="toggleGenreSelect('${g}')">${g}</button>`).join('');
    }

    window.toggleGenreSelect = function(genre) {
        const btn = document.querySelector(`.genre-option[data-genre="${genre}"]`);
        if (selectedGenres.includes(genre)) {
            selectedGenres = selectedGenres.filter(g => g !== genre);
            btn.classList.remove("active");
        } else {
            selectedGenres.push(genre);
            btn.classList.add("active");
        }
    };

    async function publishBook() {
        if (!currentUser) { openAuthModal(); return; }
        const title = document.getElementById("pubTitle").value.trim();
        const desc = document.getElementById("pubDesc").value.trim();
        if (!title || !desc) { showToast("العنوان والوصف مطلوبان", true); return; }
        if (selectedGenres.length === 0) { showToast("اختر تصنيفاً واحداً على الأقل", true); return; }
        const cover = document.getElementById("pubCover").value.trim() || "https://picsum.photos/id/20/200/300";
        const newBook = {
            title, description: desc, author: currentUser.displayName || currentUser.email.split('@')[0], authorId: currentUser.uid,
            genres: selectedGenres, cover, views: 0, rating: 0, ratingCount: 0, commentCount: 0,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(), status: "مستمر"
        };
        try {
            await db.collection("books").add(newBook);
            showToast("تم النشر بنجاح! 🎉");
            selectedGenres = [];
            await loadBooks();
            showPage("home");
        } catch (e) { showToast("خطأ في النشر: " + e.message, true); }
    }

    // صفحة التفاصيل
    async function showDetail(bookId) {
        const book = books.find(b => b.id === bookId);
        if (!book) return;
        document.getElementById("detailContent").innerHTML = `
            <div style="background:var(--bg-secondary); padding:24px; border-radius:32px;">
                <div style="display:flex; gap:24px; flex-wrap:wrap;">
                    <div style="width:150px; height:220px; background-image:url('${book.cover}'); background-size:cover; border-radius:16px;"></div>
                    <div><h1>${book.title}</h1><p>✍️ ${book.author}</p><p>${book.description}</p><div class="genres-picker" style="padding:0;">${(book.genres||[]).map(g=>`<span style="background:var(--primary); padding:4px 12px; border-radius:40px; color:white;">${g}</span>`).join('')}</div><button class="btn" onclick="showPage('home')">العودة</button></div>
                </div>
            </div>
        `;
        showPage("detail");
    }

    function showProfile() {
        if (!currentUser) { openAuthModal(); return; }
        const name = currentUser.displayName || currentUser.email.split('@')[0];
        document.getElementById("profileContent").innerHTML = `
            <div class="profile-header">
                <div class="profile-avatar">${name.charAt(0).toUpperCase()}</div>
                <div><h2>${name}</h2><p>${currentUser.email}</p><button class="btn-outline btn" onclick="signOut()">تسجيل خروج</button></div>
            </div>
            <div class="profile-header"><h3>📊 إحصائيات</h3><p>المفضلة: ${userFavorites.length}</p></div>
        `;
        showPage("profile");
    }

    function showPage(page) {
        const pages = ["homePage", "explorePage", "mylibraryPage", "publishPage", "profilePage", "detailPage"];
        pages.forEach(p => document.getElementById(p).classList.add("hidden-page"));
        document.getElementById(page + "Page").classList.remove("hidden-page");
        if (page === "home") renderHome();
        else if (page === "explore") renderExplore();
        else if (page === "mylibrary") renderLibrary();
        else if (page === "publish") showPublishPage();
        else if (page === "profile") showProfile();
        window.scrollTo(0,0);
    }

    function renderAll() { if (document.getElementById("homePage") && !document.getElementById("homePage").classList.contains("hidden-page")) renderHome(); }

    function toggleDarkMode() { document.body.classList.toggle("dark"); localStorage.setItem("darkMode", document.body.classList.contains("dark")); }
    if (localStorage.getItem("darkMode") === "true") document.body.classList.add("dark");

    auth.onAuthStateChanged(async (user) => {
        currentUser = user;
        updateAuthUI();
        if (user) await loadUserData();
        await loadBooks();
        showPage("home");
    });

    window.openAuthModal = openAuthModal; window.emailLogin = emailLogin; window.showRegisterModal = showRegisterModal;
    window.registerWithEmail = registerWithEmail; window.signInWithGoogle = signInWithGoogle; window.guestLogin = guestLogin;
    window.closeModal = closeModal; window.signOut = signOut; window.toggleFavorite = toggleFavorite; window.showDetail = showDetail;
    window.filterExplore = filterExplore; window.publishBook = publishBook; window.showPage = showPage;
</script>
</body>
    </html>
